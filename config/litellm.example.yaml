# LiteLLM-Konfiguration - Beispiel
# Kopieren als config/litellm.yaml und anpassen.
#
# Doku: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # Lokal via Ollama (in diesem Compose-Netzwerk)
  - model_name: local-qwen
    litellm_params:
      model: ollama/qwen3.5:9b
      api_base: http://ollama:11434

  # ⚠️ Cloud-Modelle: Anfragen an diese Einträge verlassen das Haus.
  # Nur bewusst und klar benannt eintragen (dsgvo-ki-checkliste, Abschnitt 7).
  #
  # Beispiel: OpenAI (API-Key via Umgebungsvariable)
  # - model_name: gpt-4o
  #   litellm_params:
  #     model: openai/gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY

  # Beispiel: Azure OpenAI
  # - model_name: azure-gpt4
  #   litellm_params:
  #     model: azure/gpt-4
  #     api_base: https://<resource>.openai.azure.com
  #     api_version: "2024-02-15-preview"
  #     api_key: os.environ/AZURE_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  drop_params: true
  # Budget-Limit pro Tag über alle Modelle hinweg (Betrag in USD)
  # max_budget: 5.0
  # budget_duration: 1d
